serial_port: "COM3"
baud_rate: 921600
fs: 1000
n_channels: 1
signal_type: envelope       # MD0437 SIG output is filtered/rectified activity envelope
window_ms: 200
step_ms: 100
bandpass: [20, 450]
notch_hz: 50
smoothing_n: 5
min_confidence: 0.6
vision_smoothing_frames: 5
pointer_smoothing_alpha: 0.35
lr_motion_threshold: 0.025
ud_motion_threshold: 0.04
lr_motion_hold_ms: 350
lr_motion_cooldown_ms: 280
camera_index: 0
backend_url: "http://127.0.0.1:8000"
# Rehabilitation games
game_session_seconds: 180   # session length; 0 = no time limit (--duration overrides)
game_difficulty: auto       # auto adapts to the patient, or easy / medium / hard
game_sound: true            # sound effects (press M in a game to mute)
game_show_screens: true     # start screen, countdown and results screen
# Grip effort threshold (Webcam + EMG mode only): a pop, brake, gold grab or shape pick-up
# counts only when the grip reaches this share of the patient's calibrated strongest squeeze.
game_effort_required: auto  # auto follows the difficulty (25% easiest to 60% hardest), or a fixed 0-100; 0 = off (--effort overrides)
game_emg_calibration: true  # relax-then-squeeze check at the start of each Webcam + EMG session; false reuses the patient's saved check
